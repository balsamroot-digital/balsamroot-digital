name: Link check

on:
    schedule:
        # Mondays at 13:00 UTC (06:00 Pacific)
        - cron: '0 13 * * 1'
    workflow_dispatch:

jobs:
    links:
        name: Check external links
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            issues: write

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            - name: Build site
              run: npm run build

            - name: Check links
              id: lychee
              uses: lycheeverse/lychee-action@v2
              with:
                  args: --config lychee.toml --no-progress 'dist/**/*.html'
                  fail: false
                  output: lychee-report.md

            - name: Open an issue if links are broken
              if: steps.lychee.outputs.exit_code != 0
              uses: peter-evans/create-issue-from-file@v6
              with:
                  title: Broken external links found
                  content-filepath: lychee-report.md
                  labels: bug, links
