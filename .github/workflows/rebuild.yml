name: Scheduled rebuild

on:
    schedule:
        # 09:00 UTC on the 1st of every month (01:00 Pacific)
        - cron: '0 9 1 * *'
    workflow_dispatch:

jobs:
    rebuild:
        name: Trigger Netlify build
        runs-on: ubuntu-latest
        steps:
            - name: Ping build hook
              run: curl -fsSL -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"
