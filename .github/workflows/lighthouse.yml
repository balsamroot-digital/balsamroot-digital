name: Lighthouse

on:
    pull_request:
    workflow_dispatch:

jobs:
    lighthouse:
        name: Audit performance & SEO
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                preset: [mobile, desktop]

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            - name: Build site
              run: npm run build

            # Mobile is Lighthouse's default — no preset is set at all.
            - name: Run Lighthouse (mobile)
              if: matrix.preset == 'mobile'
              uses: treosh/lighthouse-ci-action@v12
              with:
                  configPath: ./lighthouserc.json
                  uploadArtifacts: true
                  artifactName: lighthouse-results-mobile
                  temporaryPublicStorage: true

            - name: Run Lighthouse (desktop)
              if: matrix.preset == 'desktop'
              uses: treosh/lighthouse-ci-action@v12
              with:
                  configPath: ./lighthouserc.json
                  uploadArtifacts: true
                  artifactName: lighthouse-results-desktop
                  temporaryPublicStorage: true
              env:
                  LHCI_COLLECT__SETTINGS__PRESET: desktop
